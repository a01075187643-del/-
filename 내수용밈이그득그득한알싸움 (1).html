<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내수용밈이그득그득한알싸움</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f2ec;--fg:#1d1d1b;--card:#fffdf8;--line:#d8d3c6;--btn:#1d1d1b;--btnfg:#fffdf8;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151a;--fg:#ecebe6;--card:#1d1f26;--line:#33363f;--btn:#ecebe6;--btnfg:#14151a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14151a;--fg:#ecebe6;--card:#1d1f26;--line:#33363f;--btn:#ecebe6;--btnfg:#14151a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px 12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:22px;margin:4px 0 2px}
p.sub{margin:0 0 12px;font-size:13px;opacity:.7}
#ui{display:flex;flex-wrap:wrap;gap:8px;width:100%;max-width:600px;margin-bottom:10px}
.card{flex:1 1 90px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;transition:opacity .3s}
.card.dead{opacity:.35}
.top{display:flex;align-items:center;gap:6px}
.top i{width:10px;height:10px;border-radius:50%;flex:none}
.sk{margin-left:auto;font-size:11px;opacity:.7}
.hpb{position:relative;height:16px;background:rgba(128,128,128,.25);border-radius:8px;overflow:hidden;margin-top:6px}
.hpf{height:100%;width:100%}
.hpb em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
.gb{height:6px;background:rgba(128,128,128,.25);border-radius:3px;overflow:hidden;margin-top:5px}
.gf{height:100%;width:0;background:#ffd84a}
.uf{background:#ff7a3d}
.sb .hpf{background:#3aa0ff}
.ul{font-size:10px;opacity:.7;margin-top:4px}
#sel{width:100%;max-width:600px;text-align:center}
#sel h2{margin:0 0 4px;font-size:20px}
#msg{min-height:20px;font-size:15px;font-weight:700;margin-bottom:6px;color:#e4a400}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px}
.pl{font-size:18px;font-weight:700;color:#fff;padding:6px 10px;border-radius:10px}
.p1{background:#2e86e4}.p2{background:#e4572e}
.pp{text-decoration:none;font-size:11px;padding:1px 5px;border-radius:6px;color:#fff;margin-right:3px}
.opts{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.opt{flex:1 1 80px;border:2px solid var(--line);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.opt.on{border-color:#ffd84a;box-shadow:0 0 0 2px #ffd84a inset}
.th{width:56px;height:56px;border-radius:50%;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.opt small{font-size:11px;opacity:.7}
#go{margin-top:6px;font-size:16px;padding:12px 28px}
canvas{width:100%;max-width:600px;aspect-ratio:1/1;background:var(--card);border:2px solid var(--line);border-radius:14px;touch-action:manipulation}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;align-items:center}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
button:active{transform:scale(.96)}
.cnt{min-width:64px;text-align:center;font-size:14px}
</style>
</head>

<div id="ui"></div>

let started=false,mode='select';
function unlock(){
  try{AC.resume();const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);}catch(e){}
  if(!unlock.el){try{unlock.el=new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');unlock.el.loop=true;unlock.el.play().catch(()=>{});}catch(e){}}
}
function begin(){if(mode==='fight')started=true;if(AC.state!=='running')unlock();}
['pointerdown','touchend','click','keydown'].forEach(t=>addEventListener(t,begin));
function mk(i){
  const a=Math.random()*6.283,t=Math.floor(Math.random()*3),c=CFG[t];
  return{id:i,x:90+Math.random()*420,y:90+Math.random()*420,vx:Math.cos(a)*230,vy:Math.sin(a)*230,
    r:i===0?32:i===2?36:26,hp:200,c:COLORS[i],t,len:c.len,dmg:c.dmg,cap:c.cap,spin:c.spin*(Math.random()<.5?-1:1),
    ang:Math.random()*6.283,flash:0,alive:true,name:NAMES[i],skill:SKILLS[i],g:0,boost:0,img:i===0?faceImg:i===2?faceImg2:null,treasure:i===0,show:null,seq:i===2?['lor','jam','sky','buff','shield']:null,si:0,ult:15};
}
const ui=document.getElementById('ui'),SK={dash:'돌진',heal:'회복',shiny:'빛나',lor:'Load and Shoot',jam:'Fire! J-a-a-am!',sky:'To the sky!',buff:'Hold position!',shield:'Ready, routine Echo:',seq:'스킬 2종'};
function buildUI(){
  ui.innerHTML=balls.map(b=>`<div class="card"><div class="top"><i style="background:${b.c}"></i><b><u class="pp p${b.p}">${b.p}P</u> ${b.name}</b><span class="sk">${SK[b.skill]||'스킬 없음'}</span></div>${b.seq?'<div class="hpb sb" style="visibility:hidden"><div class="hpf sf"></div><em></em></div>':''}<div class="hpb"><div class="hpf"></div><em>100</em></div>${b.skill?'<div class="gb"><div class="gf"></div></div>':''}${(b.skill==='shiny'||b.seq)?'<div class="ul">필살기</div><div class="gb"><div class="gf uf"></div></div>':''}</div>`).join('');
  balls.forEach((b,i)=>{const c=ui.children[i];b.ui={card:c,hf:c.querySelector('.hpb:not(.sb) .hpf'),hn:c.querySelector('.hpb:not(.sb) em'),sb:c.querySelector('.sb'),sf:c.querySelector('.sf'),sn:c.querySelector('.sb em'),gf:c.querySelector('.gf'),uf:c.querySelector('.uf'),sk:c.querySelector('.sk')}});
}
function updUI(){
  for(const b of balls){
    const e=b.ui;if(!e)continue;
    e.card.classList.toggle('dead',!b.alive);
    e.hf.style.width=Math.max(0,b.hp)/2+'%';
    e.hf.style.background=b.hp>100?'#3fb950':b.hp>50?'#f2b134':'#e4572e';
    e.hn.textContent=Math.max(0,Math.ceil(b.hp));
    if(e.gf)e.gf.style.width=(b.g*100)+'%';
    if(e.sb){const on=b.shield>0&&b.alive;e.sb.style.visibility=on?'visible':'hidden';if(on){e.sf.style.width=Math.min(100,b.shield)+'%';e.sn.textContent=Math.ceil(b.shield);}}
    if(e.uf)e.uf.style.width=((b.cnt||0)%b.ult/(b.ult-1)*100)+'%';
    if(b.seq){const nk=b.seq[b.si%b.seq.length],nt='다음: '+(nk==='buff'?(((b.bv||0)+1)%2===1?'Hold position! Check, fire! (공속↑)':'Hold position! Check, fire! (데미지↑)'):SK[nk])+(b.buffLeft>0?' · 데미지×1.5 '+b.buffLeft+'회':'')+(b.asLeft>0?' · 공속↑ '+b.asLeft+'회':'')+(b.shield>0?' · 보호막 '+Math.ceil(b.shield):'');if(e.skt!==nt){e.sk.textContent=nt;e.skt=nt}}
  }
}
const selEl=document.getElementById('sel'),ROSTER=[0,1,2],IMGS={0:faceImg,2:faceImg2};
let pick=[0,2],msg='';
function renderSel(){
  document.getElementById('msg').textContent=msg;
  for(const p of[0,1]){
    const box=document.getElementById('o'+p);
    box.innerHTML=ROSTER.map(c=>`<div class="opt${pick[p]===c?' on':''}" data-c="${c}"><div class="th" style="background:${COLORS[c]}">${IMGS[c]?'<img src="'+IMGS[c].src+'">':''}</div><b>${NAMES[c]}</b><small>${SK[SKILLS[c]]||'스킬 없음'}</small></div>`).join('');
  }
}
function showSelect(){
  clearTimeout(timer);stopSlice();mode='select';started=false;
  msg=over?(over.draw?'무승부!':over.p+'P 승리!'):'';
  selEl.style.display='';cv.style.display='none';ui.style.display='none';document.getElementById('bar').style.display='none';renderSel();
}
selEl.addEventListener('click',e=>{
  const o=e.target.closest('.opt');if(!o)return;
  pick[+o.parentNode.id.slice(1)]=+o.dataset.c;renderSel();
});
document.getElementById('go').onclick=()=>{
  selEl.style.display='none';cv.style.display='';ui.style.display='';document.getElementById('bar').style.display='';
  mode='fight';unlock();reset();started=true;
};
document.getElementById('home').onclick=showSelect;
document.getElementById('retry').onclick=()=>{stopSlice();reset();started=true;};
function reset(){
  clearTimeout(timer);
  balls=pick.map((c,slot)=>{const b=mk(c);b.id=slot;b.p=slot+1;b.team=slot+1;b.x=slot?470:130;b.y=200+Math.random()*200;return b});
  stopSlice();parts=[];fl=[];cd={};over=null;buildUI();
}
function burst(x,y,col,n,sp){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.3,col});}
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);
  t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function ccw(a,b,c){return(c.y-a.y)*(b.x-a.x)>(b.y-a.y)*(c.x-a.x)}
function inter(a,b,c,d){return ccw(a,c,d)!==ccw(b,c,d)&&ccw(a,b,c)!==ccw(a,b,d)}
function seg(b){
  const ca=Math.cos(b.ang),sa=Math.sin(b.ang);
  return[{x:b.x+ca*b.r,y:b.y+sa*b.r},{x:b.x+ca*(b.r+b.len),y:b.y+sa*(b.r+b.len)}];
}

const DMGX=1;
function air(x){return !!(x.show&&x.show.kind==='sky'&&x.show.air)}
function isD(x){return !!(x.show&&x.show.kind==='jam'&&x.show.go&&x.boost>0)}
function dd(x){return x.boost>0?(x.dbn===undefined?10:5+2.5*x.dbn)*(x.buffT>0?1.5:1):5}
function hurt(b,d){
  d*=DMGX;
  if(air(b)){if(!b.ivc||performance.now()-b.ivc>400){b.ivc=performance.now();fl.push({x:b.x,y:b.y-b.r,life:.6,t:'무적',col:'#9fe3ff'});}return;}
  if(isD(b))d*=.5;
  if(b.shield>0){const cost=d*2;if(b.shield>=cost){b.shield-=cost;fl.push({x:b.x,y:b.y-b.r,life:.6,t:'-'+Math.ceil(cost),col:'#7be8ff'});b.flash=.1;return;}d-=b.shield/2;fl.push({x:b.x,y:b.y-b.r,life:.6,t:'-'+Math.ceil(b.shield),col:'#7be8ff'});b.shield=0;b.flash=.1;}
  b.hp-=d;b.flash=.15;
  if(b.skill&&!(b.seq&&b.show))b.g=Math.min(1,b.g+.1);
  fl.push({x:b.x,y:b.y-b.r,life:.8,t:'-'+d,col:'#ff5a4a'});
  burst(b.x,b.y,b.c,8,170);

function step(dt){
  for(const k in cd){cd[k]-=dt;if(cd[k]<=0)delete cd[k];}

    if(!b.alive)continue;

    const sm=b.slowT>0?.4:1;b.ang+=b.spin*dt;b.x+=b.vx*dt*sm;b.y+=b.vy*dt*sm;b.flash=Math.max(0,b.flash-dt);

    if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);b.wb=(b.wb||0)+1}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);b.wb=(b.wb||0)+1}
    if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy);b.wb=(b.wb||0)+1}
    let hold=false;const js=b.show&&b.show.kind==='jam'?b.show:null;
    if(js){
      const tt=(performance.now()-js.t0)/1000*(js.spd||1);
      if(!js.target||!js.target.alive){let m=1e9;js.target=null;for(const o of balls){if(o===b||o.team===b.team||!o.alive)continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<m){m=d;js.target=o}}}
      const T=js.target;
      if(tt<1.76){hold=true;b.vx*=.93;b.vy*=.93;}
      else if(tt<3.2){
        hold=true;
        if(!js.go){js.go=true;js.wb0=b.wb||0;b.dbn=0;const d0=T?Math.hypot(T.x-b.x,T.y-b.y)||1:Math.hypot(b.vx,b.vy)||1;b.vx=(T?T.x-b.x:b.vx)/d0*1000;b.vy=(T?T.y-b.y:b.vy)/d0*1000;}
        b.dbn=(b.wb||0)-js.wb0;b.boost=.15;
      }
    }
    if(b.buffT>0)b.buffT-=dt;
    b.z=0;
    if(b.stun>0){
      b.stun-=dt;hold=true;b.vx=0;b.vy=0;
      if(b.stun<=0){const a0=Math.random()*6.283;b.vx=Math.cos(a0)*235;b.vy=Math.sin(a0)*235;if(b.slowAfter){b.slowT=b.slowAfter;b.slowAfter=0;fl.push({x:b.x,y:b.y-b.r,o:b,life:1,t:'SLOW',col:'#7bb0ff'});}}
    }
    if(b.slowT>0)b.slowT-=dt;
    if(b.shieldT>0){b.shieldT-=dt;if(b.shieldT<=0)b.shield=0;}
    const kf=b.show&&b.show.kind==='final'?b.show:null;
    if(kf){
      const ft=(performance.now()-kf.t0)/1000;
      if(ft<1.4){hold=true;b.vx=0;b.vy=0;}
      else if(!kf.rel){kf.rel=true;const a0=Math.random()*6.283;b.vx=Math.cos(a0)*235;b.vy=Math.sin(a0)*235;}
      if(ft>=1.0&&!kf.sp){kf.sp=true;spawnClones(b);burst(b.x,b.y,'#ffd84a',40,380);fl.push({x:b.x,y:b.y-b.r,o:b,life:1.5,t:'필살기!',col:'#ffd84a'});}
    }
    const ku=b.show&&b.show.kind==='ult'?b.show:null;
    if(ku){
      const ut=(performance.now()-ku.t0)/1000;
      if(ut<4.1){hold=true;b.vx=0;b.vy=0;b.z=ut>=2.0?.1*Math.abs(Math.sin(ut*9)):0;}
      else if(!ku.rel){ku.rel=true;const a0=Math.random()*6.283;b.vx=Math.cos(a0)*235;b.vy=Math.sin(a0)*235;}
      if(ut>=2.0&&!ku.sh){ku.sh=true;b.shield=100;b.shieldT=12;fl.push({x:b.x,y:b.y-b.r,o:b,life:1.2,t:'SHIELD',col:'#7be8ff'});burst(b.x,b.y,'#7be8ff',24,260);}
    }
    if(b.show&&b.show.kind==='lor'){
      const lt=(performance.now()-b.show.t0)/1000*(b.show.spd||1);
      if(lt<3.25){hold=true;b.vx=0;b.vy=0;}
      else if(!b.show.rel){b.show.rel=true;const a0=Math.random()*6.283;b.vx=Math.cos(a0)*235;b.vy=Math.sin(a0)*235;}
    }
    const ks=b.show&&b.show.kind==='sky'?b.show:null;
    if(ks){
      const tt=(performance.now()-ks.t0)/1000*(ks.spd||1);
      if(!ks.target||!ks.target.alive)ks.target=nearest(b);
      const T=ks.target;
      ks.air=tt>=.35&&tt<2.7;
      if(tt<2.8)hold=true;
      if(tt<.35){b.vx*=.9;b.vy*=.9;}
      else if(tt<2.5){
        b.z=tt<.75?Math.sin((tt-.35)/.4*Math.PI/2):1;
        if(T){const dx=T.x-b.x,dy=T.y-b.y,d=Math.hypot(dx,dy)||1,sp=Math.min(d*2.5,320),k=Math.min(1,dt*5);b.vx+=(dx/d*sp-b.vx)*k;b.vy+=(dy/d*sp-b.vy)*k;}
      }else if(tt<2.7){

      }else if(!ks.hit){
        ks.hit=true;ks.imp=tt;shk=.3;burst(b.x,b.y,'#ffd84a',40,380);
        for(const o of balls){if(o===b||o.team===b.team||!o.alive)continue;const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1;if(d<180){hurt(o,25*(b.buffT>0?1.5:1)*(b.clone?.5:1));o.vx+=dx/d*650;o.vy+=dy/d*650;}}
      }
    }
    if(!hold){const sp=Math.hypot(b.vx,b.vy)||1,f=1+(235/sp-1)*Math.min(1,dt*2);b.vx*=f;b.vy*=f;}
  }
  const L=balls.filter(b=>b.alive);
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
    const a=L[i],b=L[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    if(a.alive&&b.alive&&a.team!==b.team&&!air(a)&&!air(b)&&d<a.r+b.r){

      if(isD(a)&&!isD(b)){b.vx=a.vx*.8;b.vy=a.vy*.8;}
      else if(isD(b)&&!isD(a)){a.vx=b.vx*.8;a.vy=b.vy*.8;}
      else{a.vx+=dv*nx;a.vy+=dv*ny;b.vx-=dv*nx;b.vy-=dv*ny;}

      if(!cd[key]){cd[key]=.3;hurt(a,dd(b)*(b.clone?.5:1));hurt(b,dd(a)*(a.clone?.5:1));}
    }
  }
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const f of fl){if(f.o){f.x=f.o.x;f.y=f.o.y-f.o.r-14;if(!f.o.alive)f.life=0;}else f.y-=40*dt;f.life-=dt}
  fl=fl.filter(f=>f.life>0);
  const alive=balls.filter(b=>b.alive&&!b.clone);
  if(!over&&alive.length<=1){
    over=alive[0]||{draw:true};
    timer=setTimeout(showSelect,3000);
  }
}

function spawnClones(b){
  const an=Math.random()*6.283;
  for(let i=0;i<5;i++){
    const a=an+i*1.2566;
    balls.push({id:20+i+b.team*10,x:b.x+Math.cos(a)*50,y:b.y+Math.sin(a)*50,vx:Math.cos(a)*320,vy:Math.sin(a)*320,r:20,hp:60,c:b.c,t:0,len:0,dmg:0,cap:0,spin:0,ang:0,flash:0,alive:true,name:'',skill:'seq',g:.2+Math.random()*.6,boost:0,img:FACES[i],treasure:false,show:null,seq:['lor','jam','sky'],si:i%3,ult:999,p:b.p,team:b.team,clone:true,life:12,own:b});
  }
}

function startUlt(b){

}
function drawUlt(b,s,tt){
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  const zy=(b.z||0)*190;
  if(tt<1.95){ctx.font='700 22px system-ui,sans-serif';colorText('Ready, routine Echo:',b.x,Math.max(22,b.y-b.r-16-zy),'first');}
  else if(tt<4.0)troopText('Dance! Oh yeah~!',b.x,b.y+b.r+24);
  if(tt>=2.0&&tt<4.0){
    ctx.font='700 20px system-ui,sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.fillStyle='#fff';
    for(let i=0;i<5;i++){const a=tt*2+i*1.256,rr=b.r+26+6*Math.sin(tt*5+i),nx=b.x+Math.cos(a)*rr,ny=b.y-zy+Math.sin(a)*rr,ch=i%2?'♪':'♫';ctx.strokeText(ch,nx,ny);ctx.fillText(ch,nx,ny);}
  }
  ctx.restore();
}
function nearest(b){let t=null,m=1e9;for(const o of balls){if(o===b||o.team===b.team||!o.alive)continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<m){m=d;t=o}}return t}
function startSky(b){
  b.show={t0:performance.now(),kind:'sky',dur:3.3,target:nearest(b),spd:b.fast?1.4:1};b.g=0;playBuf(kbuf,b,0,undefined,1,b.fast?1.4:1);
}
function drawSky(b,s,tt){
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  s.tr=s.tr||[];
  if((b.z||0)>.01){s.tr.push({x:b.x,y:b.y-b.z*190,sc:1+b.z*.6});if(s.tr.length>16)s.tr.shift();}else if(s.tr.length)s.tr.shift();
  for(let i=0;i<s.tr.length-1;i++){
    const q=s.tr[i],r=b.r*q.sc;ctx.globalAlpha=(i+1)/s.tr.length*.4;
    ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(q.x,q.y,r,0,6.283);ctx.fill();
    if(b.img&&b.img.complete){ctx.save();ctx.beginPath();ctx.arc(q.x,q.y,r,0,6.283);ctx.clip();ctx.drawImage(b.img,q.x-r,q.y-r,r*2,r*2);ctx.restore();}
  }
  ctx.globalAlpha=1;
  if(tt>=.35&&tt<2.7){const p=.5+.5*Math.sin(tt*10);ctx.strokeStyle='rgba(255,70,70,'+(.35+.35*p)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,180,0,6.283);ctx.stroke();ctx.fillStyle='rgba(255,70,70,.08)';ctx.fill();}
  if(s.imp!==undefined){const a=tt-s.imp;if(a<.45){const k=a/.45;ctx.strokeStyle='rgba(255,216,74,'+(1-k)+')';ctx.lineWidth=8*(1-k)+2;ctx.beginPath();ctx.arc(b.x,b.y,20+160*k,0,6.283);ctx.stroke();}}
  const txt=tt<.7?'Troops!':(tt<3.2?'To the sky-y-y-y!':'');
  if(txt){ctx.font='700 22px system-ui,sans-serif';const y=Math.max(22,b.y-b.r-16-(b.z||0)*190);colorText(txt,b.x,y,'first');}
  ctx.restore();
}
function startLor(b){
  let t=null,m=1e9;
  for(const o of balls){if(o===b||o.team===b.team||!o.alive)continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<m){m=d;t=o}}
  const beams=[];
  for(let i=0;i<7;i++)beams.push({t:1.45+i*.25,pink:i===6,hit:{}});
  b.show={t0:performance.now(),kind:'lor',dur:3.3,target:t,beams,spd:b.fast?1.4:1};b.g=0;playBuf(lbuf,b,0,undefined,1,b.fast?1.4:1);
}
function drawLor(b,s,tt){
  let T=s.target;
  if(!T||!T.alive){T=null;let m=1e9;for(const o of balls){if(o===b||o.team===b.team||!o.alive)continue;const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<m){m=d;T=o}}s.target=T;}
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  if(tt<1.2){ctx.font='700 22px system-ui,sans-serif';colorText('Mark Target!',b.x,b.y-b.r-14,'first');}
  else if(tt>=1.4&&tt<3.2)troopText('Load and Shoot!',b.x,b.y+b.r+24);
  if(T&&tt<2.95){
    const r=T.r+10+3*Math.sin(tt*14);
    ctx.strokeStyle='#ff3b3b';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(T.x,T.y,r,0,6.283);ctx.stroke();
    for(let i=0;i<4;i++){const a=i*Math.PI/2,c=Math.cos(a),n=Math.sin(a);ctx.beginPath();ctx.moveTo(T.x+c*(r-6),T.y+n*(r-6));ctx.lineTo(T.x+c*(r+9),T.y+n*(r+9));ctx.stroke();}
  }
  ctx.lineCap='round';
  for(const bm of s.beams){
    const age=tt-bm.t;if(age<0||age>.35)continue;
    if(bm.ang===undefined){if(!T)continue;bm.ang=Math.atan2(T.y-b.y,T.x-b.x);}
    const a=1-age/.35,ex=b.x+Math.cos(bm.ang)*1000,ey=b.y+Math.sin(bm.ang)*1000,w=bm.pink?30:16;
    ctx.shadowColor=bm.pink?'#ff4fd8':'#7be8ff';ctx.shadowBlur=16;
    ctx.strokeStyle=bm.pink?'rgba(255,79,216,'+a+')':'rgba(123,232,255,'+a+')';ctx.lineWidth=w*(.5+a*.5);
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=w*.35*(.5+a*.5);ctx.shadowBlur=0;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
    for(const o of balls){if(o===b||o.team===b.team||!o.alive||bm.hit[o.id])continue;if(segDist(o.x,o.y,b.x,b.y,ex,ey)<o.r+w/2){bm.hit[o.id]=1;hurt(o,(bm.pink?6:2)*(b.buffT>0?1.5:1)*(b.clone?.5:1));}}
  }
  ctx.restore();
}
function star(x,y,r0){
  ctx.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?r0*.25:r0;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}
  ctx.closePath();ctx.fill();
}
function drawShows(){
  const now=performance.now();
  for(const b of balls){
    const s=b.show;muteTxt=!!b.clone;if(!s)continue;
    const tt=(now-s.t0)/1000*(s.spd||1);
    if(tt>s.dur||!b.alive){if(s.buffed)b.buffT=0;b.show=null;stopSlice(b);continue;}
    if(s.kind==='lor'){drawLor(b,s,tt);continue;}
    if(s.kind==='jam'){drawJam(b,s,tt);continue;}
    if(s.kind==='sky'){drawSky(b,s,tt);continue;}
    if(s.kind==='buff'){drawBuff(b,s,tt);continue;}
    if(s.kind==='ult'){drawUlt(b,s,tt);continue;}
    if(s.kind==='final')continue;
    ctx.save();ctx.lineCap='round';ctx.shadowColor='#ffd84a';
    for(const bu of s.bursts){
      const long=bu.long,dur=long?1.5:1,age=tt-bu.t;
      if(age<0||age>dur)continue;
      const a=1-(age/dur)**2,grow=long?1:Math.min(1.5,.5+age*2);
      for(const r of bu.rays){
        const ang=r.a+r.sp*age,len=r.len*grow,ex=b.x+Math.cos(ang)*len,ey=b.y+Math.sin(ang)*len;
        ctx.strokeStyle=long?'rgba(245,184,0,'+a+')':'rgba(255,208,60,'+a+')';
        ctx.lineWidth=r.w*(long?.6+a*.4:1);ctx.shadowBlur=long?18:8;
        ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
        ctx.fillStyle='rgba(255,246,190,'+a+')';star(ex,ey,(long?16:9)*(.5+Math.random()*.7));
        const rh=r.hit||(r.hit={});
        for(const o of balls){if(o===b||o.team===b.team||!o.alive||bu.nd)continue;const lh=rh[o.id];if(long?(lh!==undefined&&tt-lh<.09):lh)continue;if(segDist(o.x,o.y,b.x,b.y,ex,ey)<o.r+ctx.lineWidth/2){rh[o.id]=long?tt:1;hurt(o,long?3:2);}}
      }
    }
    if(!s.long&&tt<.5){const a=1-tt/.5;ctx.strokeStyle='rgba(255,208,60,'+a+')';ctx.lineWidth=5*a+1;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(b.x,b.y,b.r+200*(tt/.5),0,6.283);ctx.stroke();}
    ctx.restore();
  }
}
function draw(){
  if(shk>0){shk=Math.max(0,shk-.016);cv.style.transform='translate('+((Math.random()-.5)*20*shk/.3)+'px,'+((Math.random()-.5)*20*shk/.3)+'px)';}else if(cv.style.transform)cv.style.transform='';
  updUI();
  ctx.clearRect(0,0,W,H);
  for(const b of balls){
    if(!b.alive)continue;
    const z=b.z||0;
    if(z>0){ctx.fillStyle='rgba(0,0,0,'+(.25*(1-z*.4))+')';ctx.beginPath();ctx.ellipse(b.x,b.y+b.r*.5,b.r*(1-z*.2),b.r*.4,0,0,6.283);ctx.fill();
      ctx.save();ctx.translate(b.x,b.y-z*190);ctx.scale(1+z*.6,1+z*.6);ctx.translate(-b.x,-b.y);}
    if(b.shield>0){ctx.save();ctx.globalAlpha=.25+.15*Math.sin(performance.now()/160);ctx.fillStyle='#7be8ff';ctx.beginPath();ctx.arc(b.x,b.y,b.r+12,0,6.283);ctx.fill();ctx.globalAlpha=.9;ctx.strokeStyle='#bff4ff';ctx.lineWidth=3;ctx.stroke();ctx.restore();}
    if(b.asLeft>0){ctx.save();ctx.strokeStyle='rgba(120,255,200,.85)';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(b.x,b.y,b.r+12,0,6.283);ctx.stroke();ctx.restore();}
    if(b.buffT>0||b.buffLeft>0){ctx.save();ctx.shadowColor='#ffd84a';ctx.shadowBlur=18;ctx.strokeStyle='rgba(255,216,74,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,b.r+6+2*Math.sin(performance.now()/120),0,6.283);ctx.stroke();ctx.restore();}
    if(b.treasure)drawTreasure(b);
    ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();
    if(b.img&&b.img.complete){ctx.save();ctx.clip();ctx.drawImage(b.img,b.x-b.r,b.y-b.r,b.r*2,b.r*2);ctx.restore();}
    if(b.flash>0){ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();}
    if(b.stun>0){ctx.fillStyle='rgba(150,220,255,.5)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();ctx.strokeStyle='#e6fbff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r-4,0,6.283);ctx.stroke();}
    if(b.slowT>0){ctx.strokeStyle='rgba(110,170,255,.9)';ctx.lineWidth=3;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,6.283);ctx.stroke();ctx.setLineDash([]);}
    ctx.lineWidth=4;ctx.strokeStyle=b.p===1?'#4aa3ff':'#ff6a4a';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.stroke();
    ctx.font='700 16px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.55)';const ny=b.y+(b.img?b.r*.55:1);ctx.strokeText(Math.ceil(b.hp),b.x,ny);
    ctx.fillStyle='#fff';ctx.fillText(Math.ceil(b.hp),b.x,ny);
    if(z>0)ctx.restore();
  }
  drawShows();
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x-2,p.y-2,4,4)}
  for(const f of fl){
    ctx.globalAlpha=Math.min(1,f.life*2);ctx.font=(f.o?'700 22px':'700 18px')+' system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.t,f.x,f.y);
    ctx.fillStyle=f.col;ctx.fillText(f.t,f.x,f.y);
  }
  ctx.globalAlpha=1;
  if(!started){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='700 24px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('화면을 터치하면 시작',W/2,H/2);}
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000)*speed;last=now;
  if(started){step(dt/2);step(dt/2);}draw();requestAnimationFrame(loop);
}
showSelect();requestAnimationFrame(loop);
</script>
